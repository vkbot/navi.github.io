<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Установка testnavi</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 18px; padding: 12px 20px; }
  #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px; margin-top: 16px; min-height: 140px; font-size: 13px; }
</style>
</head>
<body>
<h2>Установка testnavi на ГУ</h2>
<p>Подключите ГУ к компьютеру по USB (Chrome или Edge на компьютере). На ГУ включите отладку по USB и подтвердите ключ на экране.</p>
<button id="go">Подключить и установить</button>
<div id="log">Загружаю библиотеки...</div>

<script type="module">
const logEl = document.getElementById("log");
const log = (m) => { logEl.textContent += "\n" + m; };
const REMOTE = "/data/local/tmp/testnavi.apk";
const VER = "v2";

const withTimeout = (p, ms, what) => Promise.race([
  p,
  new Promise((_, rej) => setTimeout(() => rej(new Error("таймаут: " + what + " дольше " + ms/1000 + " с")), ms)),
]);

let lib = null, apkBlob = null;
(async () => {
  try {
    const dev   = await import("https://esm.sh/@yume-chan/adb-daemon-webusb@0.0.20");
    const adb   = await import("https://esm.sh/@yume-chan/adb@0.0.20");
    const cred  = await import("https://esm.sh/@yume-chan/adb-credential-web@0.0.20");
    const extra = await import("https://esm.sh/@yume-chan/stream-extra@0.0.20");
    lib = {
      Manager: dev.AdbDaemonWebUsbDeviceManager,
      Adb: adb.Adb,
      Transport: adb.AdbDaemonTransport,
      Store: cred.AdbWebCredentialStore ?? cred.default,
      Consumable: extra.Consumable,
      ReadableStream: extra.ReadableStream,
    };
    log("Библиотеки загружены (" + VER + ").");
    const res = await fetch("./testnavi.apk", { cache: "no-store" });
    if (!res.ok) throw new Error("testnavi.apk не найден (HTTP " + res.status + ")");
    apkBlob = await res.blob();
    log("APK готов: " + Math.round(apkBlob.size/1024) + " КБ. Нажимайте кнопку.");
  } catch (e) {
    log("Ошибка загрузки: " + (e && e.message ? e.message : e));
  }
})();

document.getElementById("go").addEventListener("click", async () => {
  if (!window.isSecureContext) return log("Нужен HTTPS.");
  if (!navigator.usb) return log("Нет WebUSB. Откройте в Chrome/Edge на компьютере.");
  if (!lib || !apkBlob) return log("Ещё загружаюсь, подождите и нажмите снова.");
  logEl.textContent = "";
  try {
    const manager = new lib.Manager(navigator.usb);
    const device = await manager.requestDevice();
    if (!device) return log("Устройство не выбрано.");
    const connection = await device.connect();
    const transport = await lib.Transport.authenticate({
      serial: device.serial, connection, credentialStore: new lib.Store(),
    });
    const adb = new lib.Adb(transport);
    log("Подключено: " + device.serial);

    const sync = await withTimeout(adb.sync(), 30000, "открытие канала");
    log("Заливаю APK (" + Math.round(apkBlob.size/1024) + " КБ)...");
    const total = apkBlob.size, reader = apkBlob.stream().getReader();
    let sent = 0, lastPct = -10;
    // 0.0.20 требует поток Consumable<Uint8Array>
    const file = new lib.ReadableStream({
      async pull(controller) {
        const { done, value } = await reader.read();
        if (done) { controller.close(); return; }
        sent += value.byteLength;
        const pct = Math.floor(sent*100/total);
        if (pct >= lastPct+10) { lastPct = pct; log("Передано " + pct + "%"); }
        controller.enqueue(new lib.Consumable(value));
      }
    });
    await withTimeout(sync.write({ filename: REMOTE, file, permission: 0o644 }), 120000, "запись APK");
    await sync.dispose();
    log("Файл записан. Устанавливаю...");

    const out = (await withTimeout(
      adb.subprocess.spawnAndWaitLegacy("pm install -r " + REMOTE), 300000, "pm install"
    )).trim();
    log(out);
    if (out.includes("Success")) {
      await adb.subprocess.spawnAndWaitLegacy("rm -f " + REMOTE);
      log("Готово: установлено, временный файл удалён.");
    } else {
      log("Установка не дала Success. Файл оставлен на ГУ: " + REMOTE);
    }
  } catch (e) {
    log("Ошибка: " + (e && e.message ? e.message : e));
  }
});
</script>
</body>
</html>
