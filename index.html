<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Установка testnavi</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 18px; padding: 12px 20px; }
  #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px; margin-top: 16px; min-height: 140px; font-size: 13px; }
</style>
</head>
<body>
<h2>Установка testnavi на ГУ</h2>
<p>Подключите ГУ к компьютеру по USB (в Chrome). На ГУ включите отладку по USB и подтвердите ключ на экране.</p>
<button id="go">Подключить и установить</button>
<div id="log"></div>

<script type="module">
import { AdbDaemonWebUsbDeviceManager } from "https://esm.sh/@yume-chan/adb-daemon-webusb@0.0.20";
import { Adb, AdbDaemonTransport } from "https://esm.sh/@yume-chan/adb@0.0.20";
import { AdbWebCredentialStore } from "https://esm.sh/@yume-chan/adb-credential-web@0.0.20";

const logEl = document.getElementById("log");
const log = (m) => { logEl.textContent += m + "\n"; };

const REMOTE = "/data/local/tmp/testnavi.apk";

document.getElementById("go").onclick = async () => {
  logEl.textContent = "";
  try {
    // APK лежит в корне этого же сайта рядом с index.html
    log("Беру testnavi.apk с сайта...");
    const apk = await (await fetch("./testnavi.apk", { cache: "no-store" })).blob();
    log("APK: " + Math.round(apk.size / 1024) + " КБ");

    const manager = new AdbDaemonWebUsbDeviceManager(navigator.usb);
    const device = await manager.requestDevice();
    if (!device) return log("Устройство не выбрано");

    const connection = await device.connect();
    const transport = await AdbDaemonTransport.authenticate({
      serial: device.serial,
      connection,
      credentialStore: new AdbWebCredentialStore("testnavi-installer"),
    });
    const adb = new Adb(transport);
    log("Подключено: " + device.serial);

    log("Заливаю APK на ГУ...");
    const sync = await adb.sync();
    await sync.write({ filename: REMOTE, file: apk.stream(), permission: 0o644, mtime: Date.now() });
    await sync.dispose();

    log("Устанавливаю...");
    const out = await adb.subprocess.noneProtocol.spawnWaitText(`pm install -r ${REMOTE}`);
    log(out.trim());

    await adb.subprocess.noneProtocol.spawnWaitText(`rm -f ${REMOTE}`);
    log("Установочный файл с ГУ удалён. Готово.");
  } catch (e) {
    log("Ошибка: " + (e && e.message ? e.message : e));
  }
};
</script>
</body>
</html>
